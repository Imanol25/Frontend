services:
  frontend-dev:
    container_name: library-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000/api/v1
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true

